name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deckdrive-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Validate production connection settings
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}" "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate image registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish ARM64 images
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/arm64 --push \
            --metadata-file "$RUNNER_TEMP/api-image.json" \
            --file infra/docker/api.Dockerfile --tag "$repository-api:$GITHUB_SHA" .
          docker buildx build --platform linux/arm64 --push \
            --metadata-file "$RUNNER_TEMP/web-image.json" \
            --file infra/docker/web.Dockerfile --tag "$repository-web:$GITHUB_SHA" .

      - name: Configure pinned SSH host identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload operational files and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          api_digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/api-image.json")"
          web_digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/web-image.json")"
          ssh -o StrictHostKeyChecking=yes "$target" 'mkdir -p deckdrive-prod/scripts/ops'
          scp -o StrictHostKeyChecking=yes infra/docker/compose.production.yml "$target:deckdrive-prod/compose.production.yml"
          scp -o StrictHostKeyChecking=yes infra/docker/Caddyfile "$target:deckdrive-prod/Caddyfile"
          scp -o StrictHostKeyChecking=yes scripts/ops/*.sh "$target:deckdrive-prod/scripts/ops/"
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=yes "$target" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -o StrictHostKeyChecking=yes "$target" \
            "bash deckdrive-prod/scripts/ops/deploy.sh '$GITHUB_SHA' '$repository' '$api_digest' '$web_digest'"
