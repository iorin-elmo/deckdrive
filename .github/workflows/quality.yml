name: Quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://deckdrive:deckdrive@127.0.0.1:5432/deckdrive
      NODE_ENV: development

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deckdrive
          POSTGRES_PASSWORD: deckdrive
          POSTGRES_DB: deckdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deckdrive -d deckdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.8.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Apply database migration
        run: pnpm db:migrate:deploy

      - name: Seed development database
        run: pnpm db:seed

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Run replay regression
        run: pnpm test:replay

      - name: Build
        run: pnpm build
