name: Quality

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://deckdrive:deckdrive@127.0.0.1:5432/deckdrive
      NODE_ENV: development

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deckdrive
          POSTGRES_PASSWORD: deckdrive
          POSTGRES_DB: deckdrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deckdrive -d deckdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.8.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Validate production operations
        run: |
          bash -n scripts/ops/*.sh
          bash tests/ops/deploy-failure.sh
          bash tests/ops/backup-contract.sh
          bash tests/ops/smoke-https.sh
          cp infra/docker/runtime.env.example infra/docker/runtime.env
          trap 'rm -f infra/docker/runtime.env' EXIT
          API_IMAGE=ghcr.io/example/deckdrive-api:test \
          WEB_IMAGE=ghcr.io/example/deckdrive-web:test \
          docker compose --env-file infra/docker/runtime.env.example \
            -f infra/docker/compose.production.yml config --no-env-resolution --quiet
          API_IMAGE=ghcr.io/example/deckdrive-api:test \
          WEB_IMAGE=ghcr.io/example/deckdrive-web:test \
          docker compose --env-file infra/docker/runtime.env.example \
            -f infra/docker/compose.production.yml config --format json | \
            jq -e '.services.api.environment.TRUSTED_PROXY_ADDRESSES == .services.web.networks.default.ipv4_address'

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Apply database migration
        run: pnpm db:migrate:deploy

      - name: Seed development database
        run: pnpm db:seed

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Run replay regression
        run: pnpm test:replay

      - name: Build
        run: pnpm build

  container-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker buildx build --platform linux/arm64 --file infra/docker/api.Dockerfile .
      - name: Build web image
        run: docker buildx build --platform linux/arm64 --file infra/docker/web.Dockerfile .
